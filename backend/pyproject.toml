[project]
name = "muse-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "composio>=0.25.0",
    "composio-openai-agents>=0.25.0",
    "cryptography>=44.0.0",
    "e2b-code-interpreter>=2.11.0",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "inngest>=0.4.0",
    "openai>=3.26.1",
    "openai-agents>=0.23.1",
    "psycopg[binary]>=3.2.0",
    "pyjwt[crypto]>=2.10.1,<3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "app"]
